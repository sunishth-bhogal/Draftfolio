# Render Blueprint — provisions the API + managed Postgres in one click.
# Frontend deploys separately on Vercel (see DEPLOY.md).
databases:
  - name: draftfolio-db
    databaseName: draftfolio
    user: draftfolio
    plan: free

services:
  - type: web
    name: draftfolio-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draftfolio-db
          property: connectionString
      - key: ENV
        value: production
      # Set to your deployed Vercel origin, e.g. https://draftfolio.vercel.app
      - key: CORS_ORIGINS
        sync: false
